services:

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
    restart: unless-stopped

  master1:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      - WORKER_URLS=http://worker1:8000,http://worker2:8000 #,http://worker3:8000 #,http://worker4:8000
    env_file:
      - .env
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
      # worker3:
      #   condition: service_healthy
      # worker4:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  master2:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      - WORKER_URLS=http://worker3:8000 #,http://worker4:8000
    env_file:
      - .env
    depends_on:
      worker3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker1:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=1
      - MAX_CONCURRENT=${MAX_CONCURRENT:-20}
      - GPU_SERVER_URL=https://dg4c7gst-8080.thundercompute.net 
      - HF_TOKEN=${HF_TOKEN}
    env_file:
      - .env   
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker2:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=2
      - GPU_SERVER_URL=https://d3apdxp5-8080.thundercompute.net   
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker3:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=3
      - GPU_SERVER_URL=https://1onkyt6h-8080.thundercompute.net 
    env_file:
      - .env  
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # worker4:
  #   build:
  #     context: .
  #     dockerfile: workers/Dockerfile
  #   environment:
  #     - WORKER_ID=4
  #     - GPU_SERVER_URL=https://cix0h16w-8080.thundercompute.net
      # env_file:
      # - .env
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 90s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - MASTER_URL=http://nginx:80
    env_file:
      - .env
    depends_on:
      - nginx