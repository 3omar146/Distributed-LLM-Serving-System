services:

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
    restart: unless-stopped

  master1:
    build:
      context: .
      dockerfile: Master/Dockerfile
    environment:
      - WORKER_URLS=http://worker1:8000,http://worker2:8000,http://worker3:8000
      - MAX_RETRIES=3
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
      worker3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  master2:
    build:
      context: .
      dockerfile: Master/Dockerfile
    environment:
      - WORKER_URLS=http://worker1:8000,http://worker2:8000,http://worker3:8000
      - MAX_RETRIES=3
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
      worker3:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker1:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=1
      - MAX_CONCURRENT=4
      - GPU_SERVER_URL=https://sanyo-national-parameters-council.trycloudflare.com
      - MAX_NEW_TOKENS=150
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker2:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=2
      - MAX_CONCURRENT=4
      - GPU_SERVER_URL=https://<vm2-tunnel-url>.trycloudflare.com
      - MAX_NEW_TOKENS=150
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker3:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=3
      - MAX_CONCURRENT=4
      - GPU_SERVER_URL=https://<vm3-tunnel-url>.trycloudflare.com
      - MAX_NEW_TOKENS=150
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
    environment:
      - MASTER_URL=http://nginx:80
      - NUM_USERS=${NUM_USERS:-50}
      - RAMP_UP_RATE=${RAMP_UP_RATE:-5}
    depends_on:
      - nginx