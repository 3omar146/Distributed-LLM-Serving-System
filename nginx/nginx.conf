worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Custom log format to track exactly which Master is being hit
    # and what status code it returns before/after retries.
    log_format debug_upstream '$remote_addr - $upstream_addr '
                            'ups_status: $upstream_status '
                            'final_status: $status '
                            'rt: $request_time';

    # Access log using the format above
    access_log /var/log/nginx/access.log debug_upstream;
    error_log  /var/log/nginx/error.log warn;

    upstream masters {
        least_conn;

        # We increase max_fails to 5 so one or two "no worker" 503s 
        # don't immediately ban the Master from the pool.
        server master1:7000 max_fails=5 fail_timeout=10s;
        server master2:7000 max_fails=5 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://masters;

            # RETRY LOGIC:
            # error: Master is down/unreachable
            # timeout: Master TCP timeout
            # http_503: Master responded but has no workers (your FastAPI case)
            # non_idempotent: Allows retrying POST requests
            proxy_next_upstream error timeout http_503 non_idempotent;
            
            # Try both masters (3 allows for a retry if one was already marked 'down')
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 60s;

            # TIME-OUTS:
            proxy_connect_timeout 5s;      # Time to establish connection
            proxy_send_timeout    30s;     # Time to send request to Master
            proxy_read_timeout    9000s;   # Keep open for long-running worker tasks

            # FORWARDING HEADERS:
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent NGINX from passing a 503 to the client immediately
            # if there is another master available to try.
            proxy_intercept_errors on;
        }
    }
}