services:

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - master1
      - master2
    restart: unless-stopped

  master1:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      - WORKER_URLS=http://worker1:8000,http://worker2:8000,http://worker3:8000
      - MAX_RETRIES=3
    depends_on:
      - worker1
      - worker2
      - worker3
    restart: unless-stopped

  master2:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      - WORKER_URLS=http://worker1:8000,http://worker2:8000,http://worker3:8000
      - MAX_RETRIES=3
    depends_on:
      - worker1
      - worker2
      - worker3
    restart: unless-stopped

  worker1:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=1
      - MAX_CONCURRENT=2
      - FAIL_RATE=0.1
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  worker2:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=2
      - MAX_CONCURRENT=2
      - FAIL_RATE=0.1
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  worker3:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      - WORKER_ID=3
      - MAX_CONCURRENT=2
      - FAIL_RATE=0.1
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - MASTER_URL=http://nginx:80
      - NUM_USERS=${NUM_USERS:-50}
      - RAMP_UP_RATE=${RAMP_UP_RATE:-5}
    depends_on:
      - nginx